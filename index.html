<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coin Recharge Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#171717}
.wrap{max-width:520px;margin:0 auto;padding:24px 16px 40px}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 30px #00000012;margin-bottom:16px}
h1{margin:0 0 6px;font-size:28px}.sub{color:#666;margin:0 0 20px}
label{display:block;font-weight:700;margin:14px 0 7px}
input,select,button{width:100%;padding:13px;border-radius:12px;border:1px solid #ddd;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pkg{background:#fafafa;cursor:pointer;text-align:left}.pkg b{display:block;font-size:18px}.pkg span{color:#666;font-size:13px}
.pkg.active{border:2px solid #111;background:#f0f0f0}
button{border:0;background:#111;color:white;font-weight:700;margin-top:18px;cursor:pointer}
.notice{font-size:13px;color:#666;line-height:1.5}.success{display:none;background:#eef9f0;padding:14px;border-radius:12px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Coin Recharge</h1>
    <p class="sub">Demo version — no real payment is processed.</p>

    <label for="username">Account username</label>
    <input id="username" placeholder="@your_username" autocomplete="off">

    <label>Choose a package</label>
    <div class="grid" id="packages"></div>

    <label for="payment">Payment method</label>
    <select id="payment">
      <option>Demo Payment</option>
      <option>Bank Transfer (demo)</option>
      <option>Card (demo)</option>
    </select>

    <button id="submit">Create Demo Order</button>
    <div class="success" id="success"></div>
  </div>

  <div class="card notice">
    <b>Security:</b> Never ask customers for TikTok passwords, login codes, or OTPs.
    A real recharge service should use an authorized payment/recharge integration and
    verify orders on the server side.
  </div>
</div>

<script>
const packages=[
  ["70 Coins","¥120"],["350 Coins","¥600"],
  ["700 Coins","¥1,200"],["1,400 Coins","¥2,400"]
];
let selected=packages[0];
const box=document.getElementById("packages");
packages.forEach((p,i)=>{
  const b=document.createElement("button");
  b.type="button"; b.className="pkg"+(i===0?" active":"");
  b.innerHTML=`<b>${p[0]}</b><span>${p[1]}</span>`;
  b.onclick=()=>{
    selected=p;
    document.querySelectorAll(".pkg").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
  };
  box.appendChild(b);
});
document.getElementById("submit").onclick=()=>{
  const u=document.getElementById("username").value.trim();
  const s=document.getElementById("success");
  if(!u){alert("Please enter an account username.");return;}
  s.style.display="block";
  s.textContent=`Demo order created: ${selected[0]} for ${u}. No real payment was made.`;
};
</script>
</body>
</html>

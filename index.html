<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Coin Exchange</title>

<style>
* {
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
  margin: 0;
  padding: 0;
  background-color: #f8f8f8;
  color: #121212;
  display: flex;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 480px;
  background: #ffffff;
  min-height: 100vh;
  padding: 20px 16px;
}

/* Header Balance Area */
.balance-section {
  text-align: center;
  padding: 24px 0 16px;
}

.main-balance {
  font-size: 38px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 6px;
}

.sub-balance {
  font-size: 13px;
  color: #8a8a8e;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.sub-balance .coin-icon {
  color: #f7a012;
}

.balance-label {
  font-size: 13px;
  color: #8a8a8e;
}

/* Input Section */
.form-group {
  margin-top: 24px;
}

.label-title {
  font-size: 14px;
  font-weight: 600;
  color: #121212;
  margin-bottom: 8px;
  display: block;
}

.input-box {
  width: 100%;
  padding: 14px 16px;
  border: 1.5px solid #fe2c55;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
  background: #ffffff;
}

/* Profile Card Area */
.profile-card {
  margin-top: 12px;
  padding: 14px 16px;
  background: #f8f8f8;
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.profile-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #e1e1e1;
  object-fit: cover;
}

.profile-info {
  display: flex;
  flex-direction: column;
}

.profile-name {
  font-size: 15px;
  font-weight: 700;
  color: #121212;
}

.profile-username {
  font-size: 13px;
  color: #8a8a8e;
  margin-bottom: 4px;
}

.profile-stats {
  font-size: 12px;
  color: #8a8a8e;
}

/* Package List Area */
.package-section {
  margin-top: 28px;
}

.packages-row {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 8px;
}

.pkg-card {
  flex: 0 0 100px;
  background: #f8f8f8;
  border: 1.5px solid transparent;
  border-radius: 12px;
  padding: 14px 10px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s ease;
}

.pkg-card.active {
  background: #ffffff;
  border-color: #fe2c55;
}

.pkg-coins {
  font-size: 16px;
  font-weight: 700;
  color: #121212;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.pkg-price {
  font-size: 13px;
  color: #8a8a8e;
  margin-top: 6px;
}

/* Action Button */
.btn-submit {
  width: 100%;
  background: #fe2c55;
  color: #ffffff;
  border: none;
  padding: 16px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  margin-top: 32px;
  cursor: pointer;
}

.btn-submit:active {
  opacity: 0.9;
}
</style>
</head>
<body>

<div class="container">

  <!-- Balance Section -->
  <div class="balance-section">
    <div class="main-balance">$8,165,182.42</div>
    <div class="sub-balance">
      = $8,165,182.42 ( <span class="coin-icon">🪙</span> 672,711,263 )
    </div>
    <div class="balance-label">Available balance to exchange the Coins</div>
  </div>

  <!-- Username Input Section -->
  <div class="form-group">
    <label class="label-title">TikTok username</label>
    <input 
      type="text" 
      id="usernameInput" 
      class="input-box" 
      value="@yunus" 
      oninput="updateProfile()"
    >
  </div>

  <!-- Profile Preview Card -->
  <div class="profile-card" id="profileCard">
    <img src="https://via.placeholder.com/44" alt="Avatar" class="profile-avatar">
    <div class="profile-info">
      <span class="profile-name" id="displayName">YUNUS³⁶</span>
      <span class="profile-username" id="displayUsername">@yunus</span>
      <span class="profile-stats">337 followers &nbsp; 446 following</span>
    </div>
  </div>

  <!-- Package Selection Section -->
  <div class="package-section">
    <label class="label-title">Exchange earnings for Coins</label>
    
    <div class="packages-row">
      <div class="pkg-card active" onclick="selectPackage(this)">
        <div class="pkg-coins">🪙 250</div>
        <div class="pkg-price">$3.03</div>
      </div>
      
      <div class="pkg-card" onclick="selectPackage(this)">
        <div class="pkg-coins">🪙 500</div>
        <div class="pkg-price">$6.07</div>
      </div>
      
      <div class="pkg-card" onclick="selectPackage(this)">
        <div class="pkg-coins">🪙 1,500</div>
        <div class="pkg-price">$18.21</div>
      </div>

      <div class="pkg-card" onclick="selectPackage(this)">
        <div class="pkg-coins">🪙 5,000</div>
        <div class="pkg-price">$60.70</div>
      </div>
    </div>
  </div>

  <!-- Submit Button -->
  <button class="btn-submit" onclick="exchangeCoins()">Exchange</button>

</div>

<script>
function selectPackage(element) {
  document.querySelectorAll('.pkg-card').forEach(card => {
    card.classList.remove('active');
  });
  element.classList.add('active');
}

function updateProfile() {
  const input = document.getElementById('usernameInput').value;
  const usernameDisplay = document.getElementById('displayUsername');
  
  if (input.trim()) {
    usernameDisplay.textContent = input.startsWith('@') ? input : '@' + input;
  } else {
    usernameDisplay.textContent = '@username';
  }
}

function exchangeCoins() {
  alert('Exchange order submitted.');
}
</script>

</body>
</html>
